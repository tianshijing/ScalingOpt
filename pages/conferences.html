<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferences & Journals - ScalingOpt</title>
    <meta name="description" content="A curated list of top conferences and journals in optimization and artificial intelligence.">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen bg-white font-inter">
    <div class="flex flex-col min-h-screen">
        <!-- Navbar -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-grow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <!-- Header -->
                <div class="text-center mb-12" data-aos="fade-up">
                    <h1 class="text-4xl md:text-5xl font-bold text-blue-900 mb-4">
                        Conferences & <span class="gradient-text">Journals</span>
                    </h1>
                    <p class="text-lg text-gray-500 max-w-3xl mx-auto">
                        A curated list of top conferences and journals where the latest optimization and AI research is published.
                    </p>
                </div>

                <!-- Search and Filter -->
                <div class="bg-white rounded-xl shadow-lg p-6 mb-8" data-aos="fade-up" data-aos-delay="100">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                                <input
                                    type="text"
                                    id="search"
                                    placeholder="Search by name, abbreviation, or description..."
                                    class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                                <button id="clear-search" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden transition-colors duration-200">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="type" class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                            <div class="relative">
                                <i data-lucide="filter" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                                <select
                                    id="type"
                                    class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white"
                                >
                                    <option value="All">All Types</option>
                                    <option value="Conference">Conference</option>
                                    <option value="Journal">Journal</option>
                                    <option value="Workshop">Workshop</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-sm text-gray-600">
                        Showing <span id="results-count">0</span> venues
                    </div>
                </div>

                <!-- Content Grid -->
                <div class="space-y-12" id="conferences-container">
                    <!-- Items will be dynamically loaded here -->
                </div>

                <!-- CTA Section -->
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl p-8 text-white text-center mt-12" data-aos="fade-up">
                    <h3 class="text-2xl font-bold mb-4">Suggest a Venue</h3>
                    <p class="text-blue-100 mb-6 max-w-2xl mx-auto">
                        Know a top-tier conference or journal we missed? Let us know!
                    </p>
                    <a
                        href="https://github.com/tianshijing/ScalingOpt/issues/new?title=Conference/Journal+Suggestion"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="inline-flex items-center px-6 py-3 bg-white text-blue-600 font-semibold rounded-lg hover:bg-gray-50 transition-colors duration-200"
                    >
                        <i data-lucide="message-square-plus" class="w-4 h-4 mr-2"></i>
                        Submit Suggestion
                    </a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Data -->
    <script src="../assets/js/conferences-data.js"></script>
    
    <!-- Utils and Layout -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    
    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Page Specific JS -->
    <script src="../assets/js/pages/conferences.js"></script>
</body>
</html>
