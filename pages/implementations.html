<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementations - ScalingOpt</title>
    <meta name="description" content="A collection of simple PyTorch implementations of neural networks and related algorithms.">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 font-inter">
    <div class="flex flex-col min-h-screen">
        <!-- Navbar -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-grow py-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Header -->
                <div class="text-center mb-16" data-aos="fade-up">
                    <h1 class="text-4xl md:text-5xl font-bold text-blue-900 mb-6">
                        Model <span class="gradient-text">Implementations</span>
                    </h1>
                    <p class="text-xl text-gray-600 max-w-3xl mx-auto mb-4">
                        A curated collection of PyTorch implementations for neural networks and algorithms.
                    </p>
                    <p class="text-sm text-gray-500">
                        Source: <a href="https://nn.labml.ai" target="_blank" class="text-blue-600 hover:underline">labml.ai</a>
                    </p>
                </div>

                <!-- Implementations Grid -->
                <div id="implementations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Content will be injected by JS -->
                </div>
            </div>
        </main>

        <!-- Back to Top Button -->
        <button id="back-to-top" class="fixed bottom-8 right-8 bg-blue-600 text-white p-3 rounded-full shadow-lg opacity-0 invisible transition-all duration-300 hover:bg-blue-700 hover:-translate-y-1 z-50" aria-label="Back to top">
            <i data-lucide="arrow-up" class="w-6 h-6"></i>
        </button>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- JavaScript -->
    <script src="../assets/js/implementations-data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            once: true,
            offset: 100,
            easing: 'ease-out-cubic'
        });

        // Initialize Lucide icons
        lucide.createIcons();

        // Render Implementations
        function renderImplementations() {
            const container = document.getElementById('implementations-grid');
            if (!container || typeof implementations === 'undefined') return;

            const html = implementations.map((section, index) => {
                return `
                    <div class="bg-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden group" data-aos="fade-up" data-aos-delay="${index * 50}">
                        <div class="p-6">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="p-2 bg-blue-50 rounded-lg text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                                    <i data-lucide="folder-open" class="w-6 h-6"></i>
                                </div>
                                <h3 class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors duration-300">
                                    ${section.category}
                                </h3>
                            </div>
                            
                            ${section.items.length > 0 ? `
                                <ul class="space-y-2">
                                    ${section.items.map(item => `
                                        <li class="flex items-start gap-2 text-gray-600 text-sm">
                                            <i data-lucide="chevron-right" class="w-4 h-4 mt-0.5 text-blue-400 flex-shrink-0"></i>
                                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600 transition-colors duration-200 hover:underline">
                                                ${item.name}
                                            </a>
                                        </li>
                                    `).join('')}
                                </ul>
                            ` : `
                                <p class="text-gray-500 text-sm italic">Collection</p>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Back to Top Button Logic
        const backToTopButton = document.getElementById('back-to-top');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopButton.classList.remove('opacity-0', 'invisible');
            } else {
                backToTopButton.classList.add('opacity-0', 'invisible');
            }
        });

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Run on load
        document.addEventListener('DOMContentLoaded', renderImplementations);
    </script>
</body>
</html>
