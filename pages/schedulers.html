<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler Library - ScalingOpt</title>
    <meta name="description" content="Explore our comprehensive collection of learning rate schedulers. Find the perfect scheduler for your deep learning training strategy.">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <!-- MathJax for mathematical notation -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 font-inter">
    <div class="flex flex-col min-h-screen">
        <!-- Navbar -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content -->
        <main class="flex-grow py-8">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Header -->
                <div class="text-center mb-12" data-aos="fade-up">
                    <h1 class="text-4xl md:text-5xl font-bold text-blue-900 mb-4">
                        Scheduler <span class="gradient-text">Library</span>
                    </h1>
                    <p class="text-xl text-blue-700 max-w-3xl mx-auto">
                        Explore our comprehensive collection of <span id="total-schedulers">10+</span> learning rate schedulers. 
                        Find the perfect strategy for your model training.
                    </p>
                </div>

                <!-- Timeline Section -->
                <section class="mb-8 relative" data-aos="fade-up" data-aos-delay="100">
                    <div class="text-center mb-12">
                        <button id="toggle-timeline" class="inline-flex items-center justify-center gap-2 group cursor-pointer hover:opacity-80 transition-opacity">
                            <h2 class="text-3xl font-bold text-gray-900">Evolution <span class="text-blue-600">Trajectory</span></h2>
                            <i data-lucide="chevron-down" class="w-8 h-8 text-blue-600 transform transition-transform duration-300" id="timeline-icon"></i>
                        </button>
                        <p class="text-lg text-gray-600 mt-2">A chronological journey through the history of LR schedulers</p>
                    </div>
                    
                    <div class="relative max-w-5xl mx-auto px-4 overflow-hidden transition-all duration-500 ease-in-out" id="timeline-wrapper" style="max-height: 0; opacity: 0;">
                        <div class="relative" id="timeline-container">
                            <!-- Timeline line -->
                            <div class="absolute left-4 md:left-1/2 transform md:-translate-x-1/2 top-0 bottom-0 w-0.5 bg-gradient-to-b from-blue-50 via-blue-300 to-blue-50"></div>
                            
                            <!-- Items will be rendered here -->
                        </div>
                    </div>
                </section>

                <!-- Filters -->
                <div class="bg-white rounded-xl shadow-lg p-6 mb-8" data-aos="fade-up" data-aos-delay="200">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <!-- Search -->
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Search schedulers..."
                                class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent search-input"
                            />
                            <button id="clear-search" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden transition-colors duration-200">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Category Filter -->
                        <div class="relative">
                            <i data-lucide="filter" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <select
                                id="category-filter"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white filter-select"
                            >
                                <option value="All">All Categories</option>
                                <option value="Decay">Decay</option>
                                <option value="Cyclic">Cyclic</option>
                                <option value="Adaptive">Adaptive</option>
                                <option value="Composite">Composite</option>
                                <option value="Custom">Custom</option>
                            </select>
                        </div>

                        <!-- Year Filter -->
                        <div class="relative">
                            <i data-lucide="calendar" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <select
                                id="year-filter"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white filter-select"
                            >
                                <option value="All">All Years</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                                <option value="2020">2020</option>
                                <option value="2018">2018</option>
                                <option value="2017">2017</option>
                                <option value="2016">2016</option>
                                <option value="2015">2015</option>
                                <option value="2012">2012</option>
                                <option value="2010">2010</option>
                            </select>
                        </div>

                        <!-- Sort -->
                        <div class="relative">
                            <i data-lucide="filter" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <select
                                id="sort-select"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white filter-select"
                            >
                                <option value="year">Sort by Year</option>
                                <option value="popularity">Sort by Popularity</option>
                                <option value="name">Sort by Name</option>
                            </select>
                        </div>
                    </div>

                    <!-- Results count -->
                    <div class="mt-4 text-sm text-gray-600">
                        Showing <span id="results-count">0</span> of <span id="total-count">0</span> schedulers
                    </div>
                </div>

                <!-- Schedulers Grid -->
                <div id="schedulers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Schedulers will be dynamically loaded here -->
                </div>

                <!-- No results -->
                <div id="no-results" class="text-center py-12 hidden">
                    <div class="text-gray-400 mb-4">
                        <i data-lucide="search" class="w-16 h-16 mx-auto"></i>
                    </div>
                    <h3 class="text-xl font-medium text-gray-900 mb-2">No schedulers found</h3>
                    <p class="text-gray-600">Try adjusting your search criteria or filters.</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- JavaScript -->
    <script src="../assets/js/schedulers-data.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <!-- Page Specific JS -->
    <script src="../assets/js/pages/schedulers.js"></script>
</body>
</html>
